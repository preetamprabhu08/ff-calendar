name: Update calendar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Forex Factory calendar
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -fsSL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o this.json
          head -c 1 this.json | grep -q '\[' || { echo "This week's feed did not return JSON"; head -c 300 this.json; exit 1; }
          curl -fsSL -A "$UA" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o next.json || echo '[]' > next.json
          head -c 1 next.json | grep -q '\[' || echo '[]' > next.json

      - name: Keep USD high-impact events only
        run: |
                    jq -s '{updated: (now|floor), events: [ (.[0][], .[1][]) | select(.country=="USD" and (.impact=="High" or .impact=="Medium")) | {date, title, impact} ]}' this.json next.json > events.json

      - name: Commit
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add events.json
          git commit -m "Update calendar" || exit 0
          git push
